services:
  ark:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ark-1p-hub:latest
    # To run a prebuilt image instead of building locally (e.g. on the Pi), use:
    # image: ghcr.io/areyesromo/ark-1p-hub:latest
    container_name: ark-1p-hub
    restart: unless-stopped
    ports:
      # 3001 outside, so it can run next to Ark 2P Hub (on 3000) on the same machine.
      - "3001:3000"
    environment:
      # The address phones should open, used for the QR code on the TV.
      # Leave unset if you open the TV page via the server's LAN IP or hostname;
      # set it if the TV uses http://localhost (Pi kiosk) or you run behind a proxy.
      # PUBLIC_URL: "http://192.168.1.50:3001"
      PORT: "3000"
      # The same port also answers https:// (self-signed), for phones that need a secure page.
      # HTTPS: "off"
      # Optional: set the admin password here instead of creating one at /admin/.
      # ADMIN_PASSWORD: "change-me"
    volumes:
      # Scores and settings made at /admin/ (join address, password) survive updates.
      - ark-data:/app/data

volumes:
  ark-data:
