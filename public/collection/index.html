<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/shared/icon.svg">
  <title>Ark 1P Hub · Collection</title>
  <link rel="stylesheet" href="/shared/common.css">
  <style>
    body { overflow-y: auto; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header nav { display: flex; gap: 8px; flex-wrap: wrap; }
    #content { display: flex; flex-direction: column; gap: 20px; }
    h1 { font-size: 2rem; margin: 0; }
    h2 { font-size: 1.15rem; margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; }
    h2 .muted { font-weight: 400; font-size: 0.9rem; }
    h3 { font-size: 0.95rem; margin: 12px 0 6px; color: var(--muted); }
    .who { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .who .name { font-size: 1.5rem; font-weight: 900; }
    .bar { flex: 1; min-width: 180px; height: 12px; border-radius: var(--r-pill); background: var(--bg-2); overflow: hidden; border: 1px solid var(--line); }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), var(--p1)); }
    .count { font-weight: 800; color: var(--good); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
    .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
    .item { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg-2); }
    .item.open { border-color: var(--good); background: linear-gradient(90deg, rgba(74, 222, 128, 0.12), var(--bg-2)); }
    .item .state { font-size: 0.8rem; font-weight: 700; color: var(--good); }
    .item:not(.open) strong { color: var(--muted); }
    .item .how { color: var(--muted); font-size: 0.85rem; }
    .players { display: flex; flex-wrap: wrap; gap: 8px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 16px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="brand"><span class="p1">ARK</span> <span class="p2">1P</span> HUB <span class="muted">· Collection</span></h1>
      <nav id="nav"></nav>
    </header>
    <div id="content"><p class="empty">Loading…</p></div>
  </main>
  <script src="/shared/common.js"></script>
  <script src="/collection/collection.js"></script>
</body>
</html>
