<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/shared/icon.svg">
  <title>Ark 1P Hub · My stats</title>
  <link rel="stylesheet" href="/shared/common.css">
  <style>
    body { overflow-y: auto; }
    main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header nav { display: flex; gap: 8px; flex-wrap: wrap; }
    #content { display: flex; flex-direction: column; gap: 20px; }
    h1 { font-size: 2rem; margin: 0; }
    h2 { font-size: 1.15rem; margin: 0 0 10px; }
    .who { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .who .name { font-size: 1.5rem; font-weight: 900; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .tile { padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; gap: 2px; }
    .tile strong { font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tile span { color: var(--muted); font-size: 0.85rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
    .list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .list li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--bg-2); border: 1px solid var(--line); }
    .list .sub { color: var(--muted); font-size: 0.85rem; }
    .list .num { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rec .num { color: var(--good); }
    .chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; align-items: end; height: 130px; }
    .chart .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; }
    .chart .bar { width: 100%; min-height: 3px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--p1), var(--p2)); }
    .chart .col.zero .bar { background: var(--line); }
    .chart .n { font-size: 0.7rem; color: var(--muted); }
    .chart .d { font-size: 0.65rem; color: var(--muted); }
    .note { color: var(--muted); font-size: 0.85rem; }
    .players { display: flex; flex-wrap: wrap; gap: 8px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 16px; font-size: 1.1rem; }
    @media (max-width: 560px) { .chart { gap: 3px; } .chart .d { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="brand"><span class="p1">ARK</span> <span class="p2">1P</span> HUB <span class="muted">· My stats</span></h1>
      <nav id="nav"></nav>
    </header>
    <div id="content"><p class="empty">Loading…</p></div>
  </main>
  <script src="/shared/common.js"></script>
  <script src="/me/me.js"></script>
</body>
</html>
